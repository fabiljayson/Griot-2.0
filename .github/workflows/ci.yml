name: CI

# The repository previously had no test workflow at all — only a keep-alive
# ping. That is how a broken `TokenTests.setUp` sat in the working tree while
# AUDIT.md still reported "365 tests, OK": the validation table was a manual
# claim that nothing enforced. This workflow makes those numbers real.
#
# Gates on every push and pull request:
#   backend  — ruff, Django system checks, migration drift, test suite + coverage
#   crawler  — the standalone crawler's own test suite
#   frontend — flutter analyze, full test suite
#   deps     — pip-audit against the pinned backend requirements
#
# If a number in AUDIT.md disagrees with what this workflow prints, the
# workflow is right.
#
# Hardening notes (public repository):
#   * Every `uses:` is pinned to a full commit SHA. Tags are mutable — anyone
#     who can move `v4` moves the code every subsequent run executes. The
#     release the SHA corresponds to is in the trailing comment.
#   * `persist-credentials: false` on each checkout: no step here pushes, so
#     there is no reason to leave even a read-only token in the workspace.
#   * Every job sets `timeout-minutes`, so a hung or hijacked step cannot
#     occupy a runner for the six-hour default.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref: a new push makes the previous run's
# result irrelevant, and the backend suite is fast enough that queuing is
# pure waste.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Pinned to the exact patch release render.yaml deploys. Testing the
    # deployed interpreter is the only number that means anything — the suite
    # previously ran solely on whatever the developer had installed (3.14
    # locally) while production ran 3.12, so a version-specific break could
    # only surface on deploy. Change this and PYTHON_VERSION in render.yaml
    # together.
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # `manage.py check` below is a Django system check, not a linter: it
      # finds neither an unused import nor an undefined name. ruff is the gate
      # for that class of defect, which is how the Phase 1 placeholder got in.
      - name: Lint (ruff)
        run: ruff check .

      - name: Django system check
        run: python manage.py check

      # Catches a model edited without its migration. Without this, the suite
      # happily passes against a stale schema and the failure only appears on
      # the Render deploy, where migrate runs at start-up.
      - name: No migration drift
        run: python manage.py makemigrations --check --dry-run

      # The OpenAPI schema is a published contract, and drf-spectacular reports
      # its problems as warnings on stderr while still writing a schema -- so a
      # regression silently drops endpoints or publishes wrong types. Nothing
      # gated this: the schema test only checked the management command's
      # aggregate summary line, which the in-process generator never emits, and
      # the `LicenceEnum` collision slipped through as a result.
      # `--fail-on-warn` turns any warning or error into a non-zero exit.
      - name: OpenAPI schema is clean
        run: python manage.py spectacular --validate --fail-on-warn --file /dev/null

      # The deploy settings must fail fast on a missing/insecure secret key
      # rather than booting with a default, so prove that they still do.
      - name: Production settings fail fast without a secret key
        run: |
          if DJANGO_SETTINGS_MODULE=config.settings.prod python manage.py check 2>/dev/null; then
            echo "::error::prod settings booted with no DJANGO_SECRET_KEY — the fail-fast guard is gone"
            exit 1
          fi
          echo "prod correctly refused to boot without DJANGO_SECRET_KEY"

      # Coverage and the suite in one pass. The floor lives in .coveragerc and
      # was measured (84%) before it was set (80%) — read the header there
      # before changing it, and ratchet it up only after tests are added.
      - name: Test suite with coverage
        run: |
          coverage run manage.py test -v 1
          coverage report

  crawler:
    name: Crawler
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The crawler is a standalone package with its own requirements.txt and is
    # not importable from the backend. Its 5 tests previously ran only on a
    # developer's machine, against whatever happened to be installed in
    # backend/.venv-linux — nowhere in CI. Running with crawler/ as the working
    # directory is what puts `extractors`/`runner` on sys.path for the
    # `from extractors import ...` the tests do.
    defaults:
      run:
        working-directory: crawler
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: crawler/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test suite
        run: python -m unittest discover -p 'test_*.py' -v

  frontend:
    name: Frontend (Flutter)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test suite
        run: flutter test --reporter compact

  deps:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            crawler/requirements.txt

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      # Non-blocking, deliberately. The one known advisory is click
      # PYSEC-2026-2132, which has no reachable upgrade path: gTTS pins
      # click>=7.1,<8.2, and the app only ever imports gTTS's library entry
      # point, never the click.edit() the advisory covers. See "Residual risk
      # R1" in AUDIT.md.
      #
      # This still earns its place: it is what tells you a *second*, genuinely
      # exploitable advisory arrived. Flip this to blocking the day R1 is
      # resolved (gTTS relaxes the pin, or the dependency is dropped).
      #
      # crawler/requirements.txt is audited here too: requests, lxml and
      # httpx run in CI on every push and were previously the one Python
      # dependency set with no audit at all.
      - name: pip-audit (advisory only — see R1)
        continue-on-error: true
        run: pip-audit -r backend/requirements.txt -r crawler/requirements.txt --strict
