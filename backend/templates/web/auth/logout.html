{% extends 'web/base.html' %}
{% load web_extras %}

{% block title %}Signed out — Griot AI{% endblock %}

{% block content %}
<div class="mx-auto max-w-md py-20 text-center">
  <span class="fa-solid fa-hand text-5xl text-ochre" aria-hidden="true"></span>
  <h1 class="mt-4 font-display text-2xl font-bold">You're signed out</h1>
  <p class="mt-2 text-sm text-secondary-text">Thanks for visiting. Your reading progress and badges are safe.</p>
  <div class="mt-8 flex justify-center gap-3">
    <a href="{% url 'web:login' %}" class="rounded-xl bg-terracotta px-6 py-3 text-sm font-bold text-white hover:bg-terracotta-dark">Sign in again</a>
    <a href="{% url 'web:home' %}" class="rounded-xl border border-brand-border px-6 py-3 text-sm font-semibold hover:bg-terracotta-tint/40">Browse stories</a>
  </div>
</div>
{% endblock %}
