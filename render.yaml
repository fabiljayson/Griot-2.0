# Render Blueprint — deploys the Griot 2.0 Django backend as-is.
# Docs: https://render.com/docs/blueprint-spec
#
# To deploy: push this repo, then in Render choose "Blueprint" and point it at
# this file. You'll be prompted for DJANGO_SECRET_KEY (sync: false). Everything
# else is wired up below; ALLOWED_HOSTS/CORS fall back to Render's own
# RENDER_EXTERNAL_HOSTNAME automatically (see backend/config/settings/prod.py).
services:
  - type: web
    name: griot-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    # `compilemessages` is Phase 5 Track A: the French catalogue ships as
    # `locale/fr/LC_MESSAGES/django.po`, and Django reads the compiled `.mo`.
    # The `.mo` is committed so the test suite can assert French actually
    # renders from a clean checkout, but the deploy recompiles it so a `.po`
    # edit can never ship alongside a stale binary. It needs the gettext
    # `msgfmt`, which is not on the slim Python image — hence the apt line.
    buildCommand: apt-get update && apt-get install -y --no-install-recommends gettext && rm -rf /var/lib/apt/lists/* && pip install -r requirements.txt && test -f static/web/css/tailwind.css || (npm install --no-save @tailwindcss/cli tailwindcss && npx tailwindcss -i static/web/css/tailwind.input.css -o static/web/css/tailwind.css --minify); python manage.py compilemessages; python manage.py collectstatic --noinput
    # preDeployCommand only runs on paid tiers, so startCommand fuses
    # `migrate` (idempotent) + gunicorn so free-plan deploys still get tables.
    preDeployCommand: python manage.py migrate --noinput
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --workers 1 --threads 2 --timeout 120 --max-requests 400 --max-requests-jitter 100 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/ready/
    autoDeployTrigger: commit
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      # 3.12.10 is the deployed interpreter, and .github/workflows/ci.yml pins
      # the backend job to the same patch release. That exact match is the
      # point: the suite used to run only on whatever the developer happened to
      # have installed (3.14 locally) while production ran 3.12, so a
      # version-specific failure could only ever surface on deploy. Change both
      # this line and the CI matrix together.
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DJANGO_SECRET_KEY
        sync: false
      # Optional overrides — omit to fall back to RENDER_EXTERNAL_HOSTNAME:
      # - key: DJANGO_ALLOWED_HOSTS
      #   value: api.example.com,www.example.com
      # Vercel-hosted Flutter web client. Add https://africanteller.org here
      # when the custom domain is wired up on Vercel.
      - key: DJANGO_CORS_ORIGINS
        value: https://griot-2-0.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: griot-db
          property: connectionString
      # Shared cache for rate limits + the JWT refresh-token blacklist. Both
      # are cache-backed, and this service runs a single gunicorn worker, so
      # LocMemCache is technically sufficient today. Set REDIS_URL anyway
      # before you touch --workers: the start-up warning in base.py is the
      # only thing standing between a worker bump and silently doubled rate
      # limits plus non-revocable refresh tokens.
      # - key: REDIS_URL
      #   fromDatabase:
      #     name: griot-cache
      #     property: connectionString
      - key: SENTRY_DSN
        sync: false
      # Luma Dream Machine bills per generated video. Leaving this unset does
      # NOT disable the feature — `get_luma_service()` falls back to
      # MockLumaAIService, which reports jobs 'completed' while pointing
      # `video_url` at an unplayable storage.example.com placeholder. Set a
      # real key, or video generation silently produces nothing playable.
      - key: LUMA_API_KEY
        sync: false
      # Rolling 24h cap on video generations started per user, to bound spend.
      - key: VIDEO_GENERATIONS_PER_USER_PER_DAY
        value: '5'

databases:
  - name: griot-db
    plan: free
    postgresMajorVersion: "16"
