name: griot_ai
description: "Griot AI — digital heritage platform for Cameroon's oral traditions."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  package_info_plus: ^10.2.1
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.11.0
  dio_smart_retry: ^7.0.1
  sqflite: 2.4.2
  sqflite_common_ffi_web: 1.0.2
  cached_network_image: ^3.4.1
  flutter_blurhash: ^0.9.1
  just_audio: ^0.10.6
  video_player: ^2.9.3
  mobile_scanner: ^7.4.0
  app_links: ^6.0.0
  connectivity_plus: ^7.3.1
  sentry_flutter: ^8.14.2
  share_plus: ^13.3.0
  path_provider: 2.1.5
  path: ^1.9.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: 10.3.4
  flutter_markdown: ^0.7.4+3
  flutter_staggered_grid_view: ^0.7.0
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf

  assets:
    - assets/logo/
    - assets/fonts/
