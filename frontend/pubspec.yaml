name: griot_ai
description: "Griot AI — digital heritage platform for Cameroon's oral traditions."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  package_info_plus: ^10.2.1
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.11.0
  dio_smart_retry: ^7.0.1
  sqflite: ^2.4.4
  sqflite_common_ffi: ^2.4.3
  sqflite_common_ffi_web: ^1.2.0
  cached_network_image: ^4.0.0
  flutter_blurhash: ^0.9.1
  just_audio: ^0.10.6
  video_player: ^2.9.3
  mobile_scanner: ^7.4.0
  app_links: ^7.2.1
  connectivity_plus: ^7.3.1
  sentry: ^9.30.0
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  path: ^1.9.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_markdown: ^0.7.4+3
  flutter_staggered_grid_view: ^0.7.0
  sentry_flutter: ^9.30.0
  hooks_riverpod: ^2.6.1
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  riverpod_lint: ^2.6.1
  url_launcher_platform_interface: ^2.3.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true

  # Fraunces + Plus Jakarta Sans are variable fonts whose `wght` axis spans
  # 100-900. The same file is registered once per weight the design system
  # uses so Flutter's font matcher resolves an exact entry (and applies the
  # axis) instead of synthesising bold. Matches the webapp's
  # `fonts.googleapis.com` ranges: Fraunces 400..800, Plus Jakarta 400..800.
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
          weight: 400
        - asset: assets/fonts/Fraunces-Variable.ttf
          weight: 500
        - asset: assets/fonts/Fraunces-Variable.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-Variable.ttf
          weight: 700
        - asset: assets/fonts/Fraunces-Variable.ttf
          weight: 800
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
          weight: 800

  # NOTE: Flutter asset directory entries are NOT recursive — every
  # subdirectory must be listed explicitly or its files are silently dropped
  # from the bundle (this is what previously hid all of `assets/imagery/**`).
  assets:
    - assets/logo/
    - assets/fonts/
    - assets/imagery/onboarding/
    - assets/imagery/regions/
    - assets/imagery/stories/
